[package]
name = "tcc_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
headers = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors","trace", "timeout", "limit", "set-header"] }

# sqlx statt diesel: reiner Rust-Postgres-Treiber, kein libpq nötig.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate" 
] }

jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
once_cell = "1.21"
validator = { version = "0.20", features = ["derive"] }
governor = "0.10.4"
tower_governor = { version = "0.8", features = ["axum"] }
tower = "0.5"
regex = "1.13"
thiserror = "2.0.18"
anyhow = "1.0.103"

# OpenTelemetry & Brücken-Crates (Aktuellste Versionen)
tracing-opentelemetry = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }

# E-Mail-Versand (SMTP-Worker)
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls", "pool"] }

[[test]]
name = "api"
path = "tests/api/mod.rs"

[dev-dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13", features = ["blocking", "form"] }