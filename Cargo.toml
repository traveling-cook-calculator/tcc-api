[package]
name = "tcc_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
headers = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors","trace", "timeout", "limit", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio","tls-rustls","postgres","uuid","chrono","json", "migrate", "macros"] }
include_dir = "0.7"
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "serde_json", "r2d2"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version ="0.13", features = ["json","blocking", "form"] }
once_cell = "1.21"
validator =  { version = "0.20", features = ["derive"] }
governor = "0.10.4"
tower_governor = { version = "0.8", features = ["axum"] }
tower = "0.5"
regex = "1.12"
thiserror = "2.0.18"
anyhow = "1.0.102"
r2d2 = "0.8.10"

# OpenTelemetry Integration für Jaeger
opentelemetry = "0.31" # Aktuelle OTel Core Lib
opentelemetry-otlp = "0.15" # OTLP Exporter für Jaeger
tracing-opentelemetry = "0.32" # Verbindet 'tracing' mit 'opentelemetry'
testcontainers = "0.27.3"


# Test-Organisation
[[test]]
name = "api"
path = "tests/api/mod.rs"

[dev-dependencies]
base64 = "0.22.1"
