name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Version Detection & Planning
  # ============================================================================
  version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_main: ${{ steps.check_branch.outputs.is_main }}
      is_prerelease: ${{ steps.check_branch.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: check_branch
        run: |
          IS_MAIN=$([[ "$GITHUB_REF" == "refs/heads/main" ]] && echo "true" || echo "false")
          IS_PRERELEASE=$([[ "$GITHUB_REF" != "refs/heads/main" && ! "$GITHUB_REF" =~ ^refs/tags ]] && echo "true" || echo "false")
          echo "is_main=${IS_MAIN}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Detect version from tag or generate
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            VERSION="v0.$(git rev-list --count HEAD).0"
          else
            BRANCH=$(echo "$GITHUB_REF" | sed 's/refs\/heads\///' | sed 's/\//-/g')
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="v0.0.0-${BRANCH}.${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

  # ============================================================================
  # Lint & Format Checks
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # ============================================================================
  # Unit & Integration Tests
  # ============================================================================
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:mysecretpassword@localhost:5432/postgres
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      # Füge hier ggf. den Port für deinen Service hinzu
      PORT: 8080 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Service
        # Wir bauen den Service zuerst, damit das Hochfahren danach schnell geht
        run: cargo build

      - name: Start Service (incl. DB Migration)
        run: |
          # Startet den Service im Hintergrund. Der Service übernimmt dabei die DB-Migration[cite: 1].
          cargo run &
          
          # Warte, bis der Service erreichbar ist (Passe die URL ggf. an deinen Health-Check an)
          echo "Warte auf den Start des Services und die Datenbankmigration..."
          timeout 30 bash -c 'until curl -s http://localhost:8080/ > /dev/null || curl -s http://localhost:8080/health > /dev/null; do sleep 1; done'
          echo "Service ist online!"

      - name: Run integration tests
        run: cargo test --test api --verbose
        timeout-minutes: 30

  # ============================================================================
  # Build Jobs (Gekürzt für die Übersicht - passe die Cache/Upload Actions analog an)
  # ============================================================================
  build-linux-x86:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: [version, lint, tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/tcc_server artifacts/tcc_server-${{ needs.version.outputs.version }}-linux-x86_64
          chmod +x artifacts/tcc_server-${{ needs.version.outputs.version }}-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/

  # (Wiederhole das Schema mit actions/upload-artifact@v4 und Swatinem/rust-cache@v2 für alle anderen Build-Jobs...)

  # ============================================================================
  # Build: Docker Image
  # ============================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [version, lint, tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ============================================================================
  # Releases
  # ============================================================================
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Stelle sicher, dass hier alle OS-Builds in den "needs" stehen
    needs: [version, build-linux-x86, build-docker]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}