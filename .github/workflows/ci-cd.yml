name: CI/CD Pipeline

# +-----------------------------------------------------------------------------+
# |  Job dependency graph (simplified):                                         |
# |                                                                             |
# |   version --+--► build (release + clippy) --+--► test ------► release      |
# |             |                               |                              |
# |   fmt ------+ (runs in parallel to build)   +--► build-image --► release   |
# |                                                                             |
# |  The binary is compiled EXACTLY ONCE and passed to all downstream jobs     |
# |  via upload-artifact -- no second Rust build anywhere in the pipeline.     |
# |                                                                             |
# |  Container images are built with Kaniko (no Docker daemon, no privileged   |
# |  flag, no socket mount). Layer cache is stored directly in the registry.   |
# +-----------------------------------------------------------------------------+

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Minimal default permissions; jobs that need more declare it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  BINARY_NAME: tcc_api
  TARGET: x86_64-unknown-linux-gnu

jobs:
  # ============================================================================
  # Version Detection
  # ============================================================================
  version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_main: ${{ steps.check_branch.outputs.is_main }}
      is_prerelease: ${{ steps.check_branch.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: check_branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "is_main=true"        >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "is_main=false"       >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false"      >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            VERSION="v0.$(git rev-list --count HEAD).0"
          else
            BRANCH="$(echo "${GITHUB_REF}" | sed 's#refs/heads/##;s#/#-#g')"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="v0.0.0-${BRANCH}.${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

  # ============================================================================
  # Format Check -- runs in parallel to build, requires no compilation
  # ============================================================================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ============================================================================
  # Build & Lint -- THE single compilation step for the entire workflow.
  #
  # Steps:
  #   1. cargo build --release    ->  produces the release binary
  #   2. cargo clippy              ->  reuses the incremental cache from step 1,
  #                                    so it adds almost no extra compile time
  #   3. cargo test --test api     ->  compiles ONLY the integration test binary
  #      --no-run                      (no link/run); the executable path is
  #                                    extracted from compiler JSON output and
  #                                    staged alongside the service binary
  #   4. upload artifacts          ->  both binaries available for downstream
  #                                    jobs; no Rust toolchain needed there
  # ============================================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: [version, fmt]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy

      # Cache key includes "release" to avoid colliding with a potential
      # debug cache (e.g. from local development).
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build release binary
        run: cargo build --locked --release --all-features --target ${{ env.TARGET }}

      # Runs after build in the same job -- no compiler restart needed;
      # clippy reuses the already-compiled object files from the cache.
      - name: Clippy (reuses build cache)
        run: |
          cargo clippy --locked --release --all-targets --all-features \
            --target ${{ env.TARGET }} -- -D warnings

      # Compile only the integration test binary -- no execution.
      # --message-format=json lets us reliably extract the output path
      # without having to glob through target/ directories.
      - name: Compile integration test binary (no run)
        shell: bash
        run: |
          set -euo pipefail
          TEST_BIN="$(
            cargo test --locked --release --test api --no-run \
              --all-features --target ${{ env.TARGET }} \
              --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "compiler-artifact"
                       and (.target.kind[] == "test"))
                     | .executable'
          )"
          echo "TEST_BIN=${TEST_BIN}" >> "$GITHUB_ENV"
          echo "Compiled test binary: ${TEST_BIN}"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSIONED="${{ env.BINARY_NAME }}-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p artifacts
          cp "target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}" "artifacts/${VERSIONED}"
          chmod +x "artifacts/${VERSIONED}"
          # Unversioned copy for convenient access in the test and image jobs
          cp "artifacts/${VERSIONED}" "artifacts/${{ env.BINARY_NAME }}"
          # Integration test binary -- fixed name so the test job needs no glob
          cp "${TEST_BIN}" "artifacts/integration-tests"
          chmod +x "artifacts/integration-tests"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/
          retention-days: 7

  # ============================================================================
  # Integration Tests -- no compilation at all. Both the service binary and
  # the test binary were built in the build job and are downloaded here.
  # ============================================================================
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ALLOW_ORIGIN: http://localhost:8080
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID_1: ${{ secrets.AUTH0_CLIENT_ID_1 }}
      AUTH0_CLIENT_SECRET_1: ${{ secrets.AUTH0_CLIENT_SECRET_1 }}
      AUTH0_CLIENT_ID_2: ${{ secrets.AUTH0_CLIENT_ID_2 }}
      AUTH0_CLIENT_SECRET_2: ${{ secrets.AUTH0_CLIENT_SECRET_2 }}
      DISABLE_RATE_LIMIT: "true"
      RUST_BACKTRACE: "1"
    steps:
      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/

      - name: Start service
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "artifacts/${{ env.BINARY_NAME }}"
          "artifacts/${{ env.BINARY_NAME }}" > app.log 2>&1 &
          echo $! > /tmp/app.pid

          echo "Waiting for service to become ready..."
          for _ in $(seq 1 60); do
            if curl -H "x-forwarded-for: 127.0.0.1" -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              echo "Service is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/app.pid)" 2>/dev/null; then
              echo "Service exited before becoming ready:"
              cat app.log
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for service startup:"
          cat app.log
          exit 1

      # No cargo, no Rust toolchain -- run the pre-compiled test binary directly.
      - name: Run integration tests
        shell: bash
        run: |
          chmod +x artifacts/integration-tests
          artifacts/integration-tests --nocapture
        timeout-minutes: 30

      - name: Stop service
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/app.pid ]]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      # Preserve service logs as an artifact so failures can be debugged.
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: app.log
          retention-days: 3

  # ============================================================================
  # Container Image -- built with Kaniko instead of Docker.
  #
  # Why Kaniko over Docker/BuildKit:
  #   - No Docker daemon required. Docker-in-Docker (DinD) needs --privileged,
  #     giving a compromised build script near-root access to the host kernel.
  #     Mounting /var/run/docker.sock is worse: full control over the host
  #     daemon and every container running on it. Kaniko eliminates both risks
  #     by building entirely in userspace without elevated privileges.
  #   - Registry-native layer cache. Kaniko pushes cache layers directly to
  #     ghcr.io/.../cache, making them persistent across runners and
  #     independent of GitHub Actions cache quotas or eviction.
  #   - Portable. Runs identically on GitHub Actions, Kubernetes (Tekton,
  #     Argo), GitLab, or any other executor -- no environment-specific
  #     workarounds needed.
  #
  # Auth: docker/login-action writes ~/.docker/config.json; Kaniko reads it
  # automatically, so no extra credential wiring is needed.
  # ============================================================================
  build-image:
    name: Build & Push Container Image (Kaniko)
    runs-on: ubuntu-latest
    needs: [version, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binary
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/

      # Copy binary and Dockerfile into an isolated build context so Kaniko
      # does not need access to the entire repository tree.
      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context
          cp "artifacts/${{ env.BINARY_NAME }}" "docker-context/${{ env.BINARY_NAME }}"
          cp Dockerfile docker-context/Dockerfile  # <--- HIER GEÄNDERT
          chmod +x "docker-context/${{ env.BINARY_NAME }}"

      # Writes credentials to ~/.docker/config.json which Kaniko picks up.
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=ref,event=branch
            type=sha

      # int128/kaniko-action wraps the Kaniko executor container.
      # cache-repository: layers are pushed to the registry, giving persistent
      # cross-run caching without relying on runner state or GHA cache quotas.
      # On pull requests we skip the push (no credentials) but still verify
      # the image builds successfully.
      - name: Build and push with Kaniko
        uses: int128/kaniko-action@v1
        with:
          context: docker-context/
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache: true
          cache-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cache

  # ============================================================================
  # GitHub Release
  # ============================================================================
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [version, test, build-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release-artifacts/

      # Remove internal helper files from the artifact bundle so only the
      # versioned binary appears as a release asset.
      - name: Strip internal artifacts from release assets
        shell: bash
        run: |
          rm -f "release-artifacts/${{ env.BINARY_NAME }}"
          rm -f "release-artifacts/integration-tests"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          files: release-artifacts/*
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}