services:
  postgres-keycloak:
    image: postgres:18-alpine
    container_name: tcc-dev-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql
    networks:
      - keycloak_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-api:
    image: postgres:18-alpine
    container_name: tcc-dev-api-postgres
    environment:
      POSTGRES_DB: tcc_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql
    networks:
      - keycloak_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d tcc_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: tcc-dev-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-ChangeMe123!}
    ports:
      - "8081:8080"
      - "9000:9000"  
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - keycloak_net
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SMTP catcher for the email-notification tests (tests/api/email/*).
  # The app under test is configured (see ci-cd.yml / local env) to send
  # via SMTP_HOST=localhost, SMTP_PORT=1025 — i.e. this service. Tests
  # read delivered mail back out via Mailpit's HTTP API on 8025.
  #
  # No healthcheck here on purpose: Mailpit's image is a minimal static
  # binary with no shell utilities (wget/curl) to probe with, unlike the
  # postgres/keycloak checks above. It starts in well under a second with
  # no dependencies, and the test helpers
  # (tests/api/email/mod.rs::wait_for_message_to) already retry/poll, so
  # `docker compose up --wait` not gating on it is not a problem in
  # practice. Feel free to add one back if your Mailpit image does ship a
  # usable HTTP probe tool.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tcc-dev-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - keycloak_net

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    networks:
      - keycloak_net
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

networks:
  keycloak_net:
    driver: bridge

volumes:
  postgres_keycloak_data:
  postgres_api_data: