  #     AUTH0_DOMAIN: ${AUTH0_DOMAIN}
  #     AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
  #     RUST_LOG: debug
  #     ADDR: 0.0.0.0:3000
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./src:/app/src:ro
  #     - ./migrations:/app/migrations:ro

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: tcc-network
