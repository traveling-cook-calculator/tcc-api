        - Locations
    delete:
      summary: Remove the end point
      description: Also marks the plan as stale, as with PATCH above.
      operationId: deleteEndPoint
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: End point deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Locations

  /cook_and_run/{cookAndRunId}/courses:
    get:
      summary: List all courses
      description: 'Not part of the v0.2.0 feature work — carried forward, see the file header note.'
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [time_asc, time_desc]
      responses:
        '200':
          description: List of courses
          content:
