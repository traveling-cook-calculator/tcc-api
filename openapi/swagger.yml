# NOTE ON SOURCES
# This file was rewritten from scratch rather than incrementally patched.
# It is based on:
#   1. The full REST layer for cook_and_run, team, sharing, and plan
#      (src/rest/cook_and_run.rs, team.rs, sharing.rs, plan.rs, auth.rs,
#      models.rs) as finalized in the v0.2.0 email/self-service feature work.
#   2. The previous swagger.yml, for the Courses and Team Notes sections
#      ONLY — those REST handlers (src/rest/course.rs, note.rs) were not
#      touched by this feature and were not reviewed source-by-source here,
#      so their request/response shapes are carried forward as best-effort
#      and should be spot-checked against src/rest/course.rs / note.rs /
#      src/rest/health.rs before being treated as fully authoritative.
# The previous document described several things that do not match the
# actual implementation (Auth0 instead of Keycloak, a richer error body with
# "message"/"details"/"timestamp" fields, 201/422 status codes on endpoints
# that actually return 200/400 with an empty or minimal body). These have
# been corrected below to match the real handler behavior.

openapi: 3.0.3

info:
  version: 0.2.0
  title: Traveling Cook Calculator API
  description: |
    RESTful API for managing Cook and Run events — social cooking experiences
    where teams cook different courses at different locations and travel
    between them.

    ## Authentication

    Two independent authentication mechanisms are supported, depending on
    the caller's role:

    - **Organizer (admin) endpoints** require a Keycloak-issued JWT Bearer
      token, validated against the configured realm's JWKS. The token must
      contain a `sub` claim (used as the resource owner ID) and either the
      `user` realm role or the equivalent client role.
    - **Participant self-service endpoints** (accessing a team without a
      Keycloak account) use a per-team, server-generated opaque token sent
      as the `X-Access-Token` header. This token is delivered to the
      participant via the invitation email (or, if no email address was
      given at creation, returned directly in the team-creation response).

    Some endpoints accept **either** mechanism (see each operation's
    `security` block); the JWT is checked first, and the request is treated
    as a participant request only if no valid `Authorization` header is
    present.

    ## Rate limiting

    - 5 requests/second per IP address (token bucket)
    - 20 request burst capacity per IP
    - Exceeding the limit returns `429` with a `Retry-After` header.

    ## Error handling

    All error responses share a single, minimal shape:

    ```json
    { "error": "Human-readable error description" }
    ```

    For `5xx` responses the `error` field is always the literal string
    `"Internal Server Error"` (internal details are logged server-side but
    never returned to the client). For `4xx` responses, `error` is a
    specific, stable-ish description of what went wrong (not a machine
    parseable error code) — do not pattern-match on its exact wording;
    match on the HTTP status code instead.

servers:
  - url: http://0.0.0.0:3000
    description: Local development server
  - url: https://api.traveling-cook.example.com
    description: Production server (placeholder — replace with the real deployment URL)

security:
  - bearerAuth: []

tags:
  - name: Cook and Run
    description: Event/project management (organizer only).
  - name: Locations
    description: Start and end point of an event.
  - name: Courses
    description: Courses cooked during an event.
  - name: Teams
    description: Team creation, self-service, lifecycle, and audit history.
  - name: Team Notes
    description: Free-text notes attached to a team.
  - name: Team Sharing
    description: Public self-registration configuration for participants.
  - name: Event Planning
    description: Route/plan generation, staleness tracking, and route-mail dispatch.
  - name: Health
    description: Service liveness check.

paths:
  /health:
    get:
      summary: Health check
      description: |
        Liveness/readiness check. Response shape is not fully verified as
        part of this document's review — spot-check against
        `src/rest/health.rs` before relying on a specific body shape.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Health

  /cook_and_run:
    get:
      summary: List all cook and run projects for a user
      description: |
        Returns all cook and run projects owned by the given user.
        `page`/`limit`/`sort` are accepted but not currently applied to
        filtering or true pagination — `pagination.total` reflects the
        real result count, while `total_pages`/`has_next`/`has_prev` are
        not computed for this endpoint (always `0`/`false`).
      operationId: listCookAndRunProjects
      parameters:
        - name: userId
          in: query
          required: true
          description: ID of the user (must match the JWT `sub` claim)
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: Accepted but not currently applied server-side.
          schema:
            type: string
            enum: [created_asc, created_desc, name_asc, name_desc, edited_asc, edited_desc]
      responses:
        '200':
          description: List of cook and run projects
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookAndRunMeta'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run

  /cook_and_run/{cookAndRunId}:
    post:
      summary: Create a new cook and run project
      description: |
        Creates a new project with the given ID. `admin_notification_email`
        is mandatory as of v0.2.0 and seeds the address later used for
        review/cancellation notifications — see the Team Sharing section.
      operationId: createCookAndRunProject
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookAndRunCreateRequest'
      responses:
        '200':
          description: Project created successfully (idempotent — repeating the same ID does not error)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run
    get:
      summary: Get cook and run project details
      description: |
        Returns the full aggregate: teams, courses, start/end point, share
        configuration, plan (including staleness), and plan configuration.
      operationId: getCookAndRunProject
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Full project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookAndRun'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run
    delete:
      summary: Delete a cook and run project
      description: Permanently deletes the project and its start/end points. Cannot be undone.
      operationId: deleteCookAndRunProject
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Project deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run

  /cook_and_run/{cookAndRunId}/metadata:
    get:
      summary: Get project metadata
      operationId: getCookAndRunMetadata
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Project metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookAndRunMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run
    patch:
      summary: Update project metadata
      description: |
        Full replacement of name, occurrence date, and
        `admin_notification_email` (all three are mandatory in the request
        body — this is not a partial patch).
      operationId: updateCookAndRunMetadata
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetaRequest'
      responses:
        '200':
          description: Metadata updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cook and Run

  /cook_and_run/{cookAndRunId}/start_point:
    get:
      summary: Get the start point
      operationId: getStartPoint
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Start point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Locations
    patch:
      summary: Set or replace the start point
      description: |
        Creates or overwrites the start point. As of v0.2.0 this also marks
        the project's plan as stale (see `Plan.stale_since`), since a
        changed start location may invalidate previously computed routes.
      operationId: updateStartPoint
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Point'
      responses:
        '200':
          description: Start point updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Locations
    delete:
      summary: Remove the start point
      description: Also marks the plan as stale, as with PATCH above.
      operationId: deleteStartPoint
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Start point deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Locations

  /cook_and_run/{cookAndRunId}/end_point:
    get:
      summary: Get the end point
      operationId: getEndPoint
      parameters:
