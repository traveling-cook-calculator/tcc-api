  /cook_and_run/{cookAndRunId}/teams:
    get:
      summary: List all teams
      description: |
        `page`/`limit`/`sort` are currently accepted but not applied —
        the response contains every team for the project, and
        `pagination` is a fixed stub (not a real page count).
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name_asc, name_desc, created_asc, created_desc]
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}:
    post:
      summary: Create (register) a team
      description: |
        Client-generated `teamId`. Authentication is optional:

        - **Authenticated (organizer-created team):** the team is linked to
          the caller and always starts as `active`; share-config checks
          (deadline, capacity, required fields) do not apply to the owner.
        - **Unauthenticated (participant self-registration via a share
          link):** the request is validated against the active
          `ShareTeamConfig` for the project (registration deadline, max
          team count, required fields). The initial `status` is `review` if
          `ShareTeamConfig.default_needs_check` is `true`, otherwise
          `active`.

        `mail` is **not** mandatory unless the active share configuration
        lists `mail` in `required_fields`. If no `mail` is supplied, the
        response includes `access_link` — the only way to reach the team
        afterwards, since no invitation email can be sent. If `mail` is
        supplied, `access_link` is omitted and the deeplink is delivered by
        email instead.

        Retrying with the same `teamId` is idempotent.
      operationId: createTeam
      security: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreateResponse'
        '400':
          description: Validation error, missing required field, registration deadline exceeded, or team capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams
    get:
      summary: Get team details (dual authentication)
      description: |
        Callable either by the project organizer (`Authorization: Bearer`)
        or by the team itself (`X-Access-Token`). When called with a
        participant token, the response also includes `edit_deadline`
        (derived from the active share configuration); this field is
        omitted for organizer calls.

        A token that does not belong to `teamId`/`cookAndRunId` returns
        `404` (not `403`) to avoid revealing whether the IDs exist.
      operationId: getTeam
      security:
        - bearerAuth: []
        - participantAccessToken: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSelfServiceResponse'
        '400':
          description: Missing X-Access-Token header (when no Authorization header is present either)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams
    patch:
      summary: Update team details (dual authentication)
      description: |
        Same dual-auth model as GET above. A team with `status = canceled`
        can no longer be edited by anyone (`409`). For a participant call,
        editing after `share.edit_deadline` has passed also fails (`400`).

        If a field listed in the active `review_trigger_fields` changes via
        a **participant** call, `status` becomes `review` and, if enabled,
        the organizer receives an email notification. Organizer-initiated
        edits never trigger this transition.
      operationId: updateTeam
      security:
        - bearerAuth: []
        - participantAccessToken: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '200':
          description: Team updated successfully
        '400':
          description: Validation error, missing X-Access-Token header, or edit deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Team is canceled and can no longer be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams
    delete:
      summary: Delete a team (organizer only, permanent)
      description: |
        Hard delete — distinct from participant cancellation. If the team
        was part of a computed plan, the plan is marked stale as a side
        effect. No audit-log entry is written for this action (it would be
        cascade-deleted along with the team immediately).
      operationId: deleteTeam
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}/audit-log:
    get:
      summary: Get a team's change history
      description: Organizer only. Records creation, updates (with before/after diffs), cancellation, and plan-invalidation events.
      operationId: getTeamAuditLog
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}/resend-verification:
    post:
      summary: Resend the verification email (dual authentication)
      description: |
        Same URL for both roles; distinguished purely by which credential
        is presented:

        - **Organizer** (`Authorization: Bearer`): no attempt limit.
        - **Participant** (`X-Access-Token`): limited to 3 resend attempts
          per team; a 4th attempt returns `400`.
      operationId: resendVerification
      security:
        - bearerAuth: []
        - participantAccessToken: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Verification email re-enqueued
        '400':
          description: Missing X-Access-Token header, or the participant resend limit (3) was exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}/cancel:
    post:
      summary: Cancel the team (participant only)
      description: |
        Participant self-service only — the organizer cancels by deleting
        the team instead (`DELETE .../team/{teamId}`). The team is never
        removed; only its `status` changes to `canceled`. Idempotent: a
        second call is a no-op and does not overwrite the recorded reason
        or emit a duplicate notification/audit entry. If the active share
        configuration has `notify_admin_on_review = true` and the project
        has an `admin_notification_email`, the organizer is notified.
      operationId: cancelTeam
      security:
        - participantAccessToken: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTeamRequest'
      responses:
        '200':
          description: Team canceled (or already canceled — no-op)
        '400':
          description: Missing X-Access-Token header, edit deadline exceeded, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}/verify:
    post:
      summary: Confirm the team's email address (participant only)
      description: |
        Deliberately a `POST` rather than a `GET`, so that email clients or
        security scanners that prefetch links in the invitation email
        cannot accidentally trigger verification just by opening the mail.
      operationId: verifyTeamEmail
      security:
        - participantAccessToken: []
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Email address confirmed
        '400':
          description: Missing X-Access-Token header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Teams

  /cook_and_run/{cookAndRunId}/team/{teamId}/notes:
    get:
      summary: List all notes for a team
      description: 'Not part of the v0.2.0 feature work — carried forward, see the file header note.'
      operationId: getTeamNotes
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_asc, created_desc]
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Notes

  /cook_and_run/{cookAndRunId}/team/{teamId}/note/{noteId}:
    get:
      summary: Get a note
      operationId: getNote
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Notes
    post:
      summary: Create a note for a team
      description: 'Client-generated `noteId`, same pattern as team/course creation.'
      operationId: createTeamNote
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '200':
          description: Note created successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Notes
    delete:
      summary: Delete a note
      operationId: deleteTeamNote
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Notes

  /cook_and_run/{cookAndRunId}/share_team_config:
    post:
      summary: Create the team self-registration configuration
      description: |
        Enables participant self-registration via a share link, and
        configures the self-service behavior for teams created under it
        (verification requirement, review triggers, admin notifications,
        deadlines). A project has at most one active configuration.
      operationId: createShareTeamConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareTeamConfigCreateRequest'
      responses:
        '200':
          description: Configuration created successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Sharing
    get:
      summary: Get the sharing configuration
      operationId: getShareTeamConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Sharing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareTeamConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Sharing
    patch:
      summary: Replace the sharing configuration
      description: Full replacement; the existing configuration's stable ID is preserved internally.
      operationId: updateShareTeamConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareTeamConfigCreateRequest'
      responses:
        '200':
          description: Configuration updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Sharing
    delete:
      summary: Delete the sharing configuration
      description: Disables self-registration; existing share links stop working. Does not affect already-created teams.
      operationId: deleteShareTeamConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Configuration deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Team Sharing

  /cook_and_run/{cookAndRunId}/plan:
    get:
      summary: Get the computed plan
      description: |
        `stale_since` is present (non-null) if the plan may no longer be
        accurate — see the Event Planning endpoints below for what causes
        and resolves staleness.
      operationId: getPlan
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Event plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning
    patch:
      summary: Replace the plan
      description: |
        Full replacement (the frontend computes the new plan and submits it
        as a whole; partial recompute logic lives client-side). The newly
        inserted plan always starts fresh (`stale_since` absent), so
        replacing the plan implicitly resolves any prior staleness — no
        separate confirm call is needed after a full recompute.
      operationId: updatePlan
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
      responses:
        '200':
          description: Plan updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning
    delete:
      summary: Delete the plan
      operationId: deletePlan
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Plan deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning

  /cook_and_run/{cookAndRunId}/plan/confirm:
    post:
      summary: Confirm the current plan is still valid
      description: |
        Clears the plan's staleness marker **without** touching the plan
        data itself. Used when the admin has reviewed a change that
        triggered staleness (e.g. a changed team address) and determined
        the existing plan is still accurate — as an alternative to
        recomputing the plan from scratch via `PATCH .../plan`.
      operationId: confirmPlan
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Plan confirmed (staleness cleared)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning

  /cook_and_run/{cookAndRunId}/plan/send-route-mails:
    post:
      summary: Send route emails to teams (smart update)
      description: |
        Computes each non-canceled team's route from the current plan,
        compares it against the hash recorded at the last send, and
        enqueues a route-update email **only** for teams whose route
        actually changed. Teams without an email address are reported as
        skipped rather than failed. Fails with `409` if the plan is
        currently marked stale — recompute the plan or confirm it first.
      operationId: sendRouteMails
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
        - name: force
          in: query
          required: false
          description: If true, sends to every team with an email address regardless of whether their route changed.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Dispatch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteMailTriggerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: The plan is currently stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning

  /cook_and_run/{cookAndRunId}/plan_config:
    get:
      summary: Get the plan configuration
      operationId: getPlanConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Plan configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning
    patch:
      summary: Replace the plan configuration
      description: 'Note: `language` here is the single, central source of truth for what language participant emails (invitation, route-update) are sent in.'
      operationId: updatePlanConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanConfig'
      responses:
        '200':
          description: Plan configuration updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning
    delete:
      summary: Delete the plan configuration
      operationId: deletePlanConfig
      parameters:
        - $ref: '#/components/parameters/CookAndRunId'
      responses:
        '200':
          description: Plan configuration deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Event Planning

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT. Required for all organizer (admin) operations.
    participantAccessToken:
      type: apiKey
      in: header
      name: X-Access-Token
      description: |
        Per-team opaque self-service token, issued at team creation and
        delivered via email (or returned directly if no email was given).

  parameters:
    CookAndRunId:
      name: cookAndRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequestError:
      description: Validation error or business-rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found (or not owned by the caller)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Rate limit exceeded (5 req/s, burst 20, per IP)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error. The response body never contains internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: For 5xx responses this is always "Internal Server Error"; for 4xx it is a specific (but not machine-parseable) description.

    PaginationInfo:
      type: object
      required: [page, limit, total, total_pages, has_next, has_prev]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    Address:
      type: object
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Point:
      type: object
      required: [address, name, time]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
          minLength: 1
          maxLength: 200
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '18:30'

    CookAndRunMeta:
      type: object
      required: [id, user_id, name, created, edited, occur]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        name:
          type: string
        created:
          type: string
          format: date-time
        edited:
          type: string
          format: date-time
        occur:
          type: string
          format: date-time
        admin_notification_email:
          type: string
          format: email
          nullable: true

    CookAndRunCreateRequest:
      type: object
      required: [name, userId, admin_notification_email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        userId:
          type: string
        admin_notification_email:
          type: string
          format: email

    UpdateMetaRequest:
      type: object
      required: [name, occur, admin_notification_email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        occur:
          type: string
          format: date-time
        admin_notification_email:
          type: string
          format: email

    Course:
      type: object
      required: [id, name, time, has_multiple_hosts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        time:
          type: string
        has_multiple_hosts:
          type: boolean

    CourseCreateRequest:
      type: object
      required: [name, time]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    CourseUpdateRequest:
      type: object
      required: [name, time, has_multiple_hosts]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        has_multiple_hosts:
          type: boolean

    TeamStatus:
      type: string
      enum: [active, review, canceled]
      description: |
        `active`: normal state. `review`: flagged for organizer attention
        (either set at creation via `default_needs_check`, or by a
        participant edit touching a `review_trigger_fields` field).
        `canceled`: terminal — set only via `POST .../cancel`; the team is
        never deleted and can no longer be edited by anyone.

    Team:
      type: object
      required: [id, cook_and_run_id, name, address, note_list, created, edited, status]
      properties:
        id:
          type: string
          format: uuid
        cook_and_run_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        mail:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        members:
          type: integer
          nullable: true
        diets:
          type: string
          nullable: true
        note_list:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        created_by_user:
          type: string
          nullable: true
          description: Keycloak `sub` of the organizer, if created by the organizer.
        created:
          type: string
          format: date-time
        edited:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TeamStatus'
        canceled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true

    TeamCreateRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        userId:
          type: string
          nullable: true
          description: Only meaningful when the request is also authenticated; must match the JWT subject.
        address:
          $ref: '#/components/schemas/Address'
        mail:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        members:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        diets:
          type: string
          maxLength: 500
          nullable: true

    TeamUpdateRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/Address'
        mail:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        members:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        diets:
          type: string
          maxLength: 500
          nullable: true

    TeamCreateResponse:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            access_link:
              type: string
              format: uri
              nullable: true
              description: Present only when no `mail` was supplied at creation.
            warning:
              type: string
              nullable: true
              description: Human-readable warning accompanying `access_link`.

    TeamSelfServiceResponse:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            edit_deadline:
              type: string
              format: date-time
              nullable: true
              description: Present only for participant (`X-Access-Token`) calls.

    CancelTeamRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          nullable: true

    Note:
      type: object
      required: [id, headline, content, created]
      properties:
        id:
          type: string
          format: uuid
        headline:
          type: string
        content:
          type: string
        created:
          type: string
          format: date-time

    NoteCreateRequest:
      type: object
      required: [headline, content]
      properties:
        headline:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 50000

    RequiredField:
      type: string
      enum: [mail, phone, members, diets]

    ShareTeamConfig:
      type: object
      required:
        - id
        - invite_text
        - require_email_verification
        - default_needs_check
        - required_fields
        - review_trigger_fields
        - notify_admin_on_review
        - created
      properties:
        id:
          type: string
          format: uuid
        invite_text:
          type: string
        require_email_verification:
          type: boolean
          description: Controls whether the invitation email includes a verification call-to-action. Does not gate team creation itself.
        default_needs_check:
          type: boolean
          description: If true, self-registered teams start with status "review" instead of "active".
        required_fields:
          type: array
          items:
            $ref: '#/components/schemas/RequiredField'
        max_teams:
          type: integer
          nullable: true
        registration_deadline:
          type: string
          format: date-time
          nullable: true
          description: Cutoff for creating new teams via this share config.
        edit_deadline:
          type: string
          format: date-time
          nullable: true
          description: Cutoff for participant self-service edits/cancellation. Independent from registration_deadline.
        review_trigger_fields:
          type: array
          items:
            $ref: '#/components/schemas/RequiredField'
          description: Self-service edits to any of these fields flip the team's status to "review".
        notify_admin_on_review:
          type: boolean
          description: Also controls admin notifications on team cancellation.
        created:
          type: string
          format: date-time

    ShareTeamConfigCreateRequest:
      type: object
      required:
        - invite_text
        - require_email_verification
        - default_needs_check
        - required_fields
        - review_trigger_fields
        - notify_admin_on_review
      properties:
        invite_text:
          type: string
          minLength: 1
          maxLength: 5000
        require_email_verification:
          type: boolean
        default_needs_check:
          type: boolean
        required_fields:
          type: array
          items:
            $ref: '#/components/schemas/RequiredField'
        max_teams:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        registration_deadline:
          type: string
          format: date-time
          nullable: true
        edit_deadline:
          type: string
          format: date-time
          nullable: true
        review_trigger_fields:
          type: array
          items:
            $ref: '#/components/schemas/RequiredField'
        notify_admin_on_review:
          type: boolean

    Hosting:
      type: object
      required: [id, name, host, guest_list]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          format: uuid
          description: Course ID.
        host:
          type: string
          format: uuid
          description: Team ID of the hosting team.
        guest_list:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uuid
          description: Team IDs of guest teams at this hosting.

    Plan:
      type: object
      required: [hosting_list, walking_path]
      properties:
        hosting_list:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/Hosting'
        walking_path:
          type: object
          description: Map of team ID to the ordered list of hosting IDs that team visits.
          additionalProperties:
            type: array
            items:
              type: string
              format: uuid
        stale_since:
          type: string
          format: date-time
          nullable: true
          description: |
            Present only when the plan may be out of date (a referenced team
            was added/canceled/had its address changed, or the project's
            start/end point changed). Absent entirely when the plan is
            current.

    PlanConfig:
      type: object
      required: [title, description, date, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date
        language:
          type: string
          enum: [deu, eng]
          description: Central source of truth for the language participant emails are sent in.

    CookAndRun:
      type: object
      required: [id, user_id, name, created, edited, occur, team_list, course_list]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        name:
          type: string
        created:
          type: string
          format: date-time
        edited:
          type: string
          format: date-time
        occur:
          type: string
          format: date-time
        team_list:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        course_list:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        start_point:
          $ref: '#/components/schemas/Point'
        end_point:
          $ref: '#/components/schemas/Point'
        share_team_config:
          $ref: '#/components/schemas/ShareTeamConfig'
        plan:
          $ref: '#/components/schemas/Plan'
        plan_config:
          $ref: '#/components/schemas/PlanConfig'

    AuditActorType:
      type: string
      enum: [admin, participant, system]
      description: '"system" is used for automated events such as plan invalidation.'

    AuditAction:
      type: string
      enum: [created, updated, canceled, plan_invalidated]

    AuditLogEntry:
      type: object
      required: [id, actor_type, action, changes, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          $ref: '#/components/schemas/AuditActorType'
        actor_label:
          type: string
          nullable: true
          description: Keycloak user ID for organizer actions; null for participant/system actions.
        action:
          $ref: '#/components/schemas/AuditAction'
        changes:
          type: object
          description: Free-form JSON diff/context; shape depends on `action` (e.g. `{before, after}` for "updated").
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AuditLogResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    RouteMailFailure:
      type: object
      required: [team_id, error]
      properties:
        team_id:
          type: string
          format: uuid
        error:
          type: string

    RouteMailTriggerResponse:
      type: object
      required: [sent_to_team_ids, skipped_no_mail_team_ids, failed]
      properties:
        sent_to_team_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped_no_mail_team_ids:
          type: array
          items:
            type: string
            format: uuid
        failed:
          type: array
          items:
            $ref: '#/components/schemas/RouteMailFailure'